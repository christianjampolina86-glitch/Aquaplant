version: '3.8'

services:
  aquaplant-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aquaplant_station
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=aquaplant_jwt_secret_production_2026
      - DEVICE_KEY=aquaplant_esp32_device_key_secret_2026
      - ALLOW_REGISTRATION=true
      # Point to external MySQL (e.g., sql12.freesqldatabase.com) or internal container:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=aquaplant
      - DB_PASSWORD=aquaplant_secure_pass
      - DB_NAME=aquaplant
      - DB_SSL=false
      # Semaphore SMS Integration (₱500 Budget · ₱0.50/SMS):
      - SEMAPHORE_API_KEY=${SEMAPHORE_API_KEY:-}
      - SEMAPHORE_SENDER_NAME=${SEMAPHORE_SENDER_NAME:-SEMAPHORE}
    depends_on:
      mysql-db:
        condition: service_healthy

  mysql-db:
    image: mysql:8.0
    container_name: aquaplant_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_pass
      MYSQL_DATABASE: aquaplant
      MYSQL_USER: aquaplant
      MYSQL_PASSWORD: aquaplant_secure_pass
    volumes:
      - aquaplant_db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aquaplant_db_data:
