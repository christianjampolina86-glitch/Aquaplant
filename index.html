<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AQUAPLANT - Automated Hydroponic Monitoring & Control Web App</title>
    <meta name="description" content="ESP32-based automated hydroponic reservoir flushing and nutrient re-balancing system using TDS/pH feedback with real-time telemetry, relay controls, and hardware diagnostics." />
    <meta property="og:title" content="AQUAPLANT - Automated Hydroponic Monitoring & Control Web App" />
    <meta property="og:description" content="ESP32-based automated hydroponic reservoir flushing and nutrient re-balancing system using TDS/pH feedback." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('aquaplant_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
