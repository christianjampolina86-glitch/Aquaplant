services:
  - type: web
    name: aquaplant-station
    runtime: node
    # Singapore is the closest region for the Philippines. Change if you prefer.
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/system/status
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically. Do NOT hardcode it here.
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_KEY
        value: aquaplant_esp32_device_key_secret_2026
      - key: ALLOW_REGISTRATION
        value: "true"
      # TiDB Cloud connection (mysql2 driver).
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # IPROG SMS gateway token (https://www.iprogsms.com).
      - key: IPROG_API_KEY
        sync: false
      # Required in production: the code typed into "Register Admin".
      - key: ADMIN_SIGNUP_CODE
        sync: false
